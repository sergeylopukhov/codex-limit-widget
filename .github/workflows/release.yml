name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build release archive
        run: ./scripts/make-release.command

      - name: Prepare release description
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_NAME" = "v1.2.251" ] || [ "$GITHUB_REF_NAME" = "v1.2.302" ] || [ "$GITHUB_REF_NAME" = "v1.2.303" ] || [ "$GITHUB_REF_NAME" = "v1.2.304" ] || [ "$GITHUB_REF_NAME" = "v1.2.401" ]; then
            echo "RELEASE_NAME=Codex Limit Widget $VERSION (Bugfix)" >> "$GITHUB_ENV"
          else
            echo "RELEASE_NAME=Codex Limit Widget $VERSION" >> "$GITHUB_ENV"
          fi

          if [ "$GITHUB_REF_NAME" = "v1.3.0" ]; then
            cat > release-description.md <<'RELEASE_NOTES_EN'
          ## What's new in 1.3.0

          Codex Limit Widget 1.3.0 reorganizes Settings into tabs, adds a colored menu bar meter, and brings back the system glass on desktop widgets.

          ### Settings

          - Settings are split into tabs: General, Menu bar, Widgets, Notifications, Updates, and Diagnostics.
          - The window can be dragged anywhere and no longer stays above other apps.
          - The app no longer opens an empty window at launch.

          ### Menu bar and popover

          - In percent mode the meter under the number goes from green at a full limit to dark red near zero. It is on by default, including after the update.
          - A separate switch paints the digits in the same color, so you can color the meter, the digits, both, or neither.
          - The meter is thicker and the digits are slightly larger.
          - Both meters in the popover use the same color scale.
          - A second press of the keyboard shortcut closes the detailed limits window.

          ### Widgets

          - Desktop widgets turn into system glass again when a window covers the desktop, in both the beige and the dark design. Right after an update macOS may take up to a minute to apply it.
          - Widget text no longer gets cut off, and the out-of-date marker shows in every widget size.

          ### Language

          - With Russian selected, the detailed limits window, the popover, and low-limit notifications no longer mix in English words.

          ### Updates

          - The updater installs a new version only when its SHA-256 checksum matches the one published on GitHub.

          ## Installation

          Download `CodexLimitWidget-1.3.0-macOS.dmg`, open it, and drag `Codex Limit Widget.app` to `Applications`. Existing users can install this version from inside the app.
          RELEASE_NOTES_EN
            cat >> release-description.md <<'RELEASE_NOTES_RU'

          ---

          ## Что нового в 1.3.0

          В версии 1.3.0 настройки разложены по вкладкам, в строке меню появилась цветная шкала, а виджеты на рабочем столе снова становятся стеклянными.

          ### Настройки

          - Настройки разбиты на вкладки: «Общие», «Строка меню», «Виджеты», «Уведомления», «Обновления» и «Диагностика».
          - Окно можно перетащить куда угодно, и оно больше не висит поверх других приложений.
          - При запуске больше не появляется пустое окно приложения.

          ### Строка меню и поповер

          - В режиме процента шкала под числом меняет цвет от зелёного при полном лимите до тёмно-красного у нуля. Она включена по умолчанию, в том числе после обновления.
          - Отдельный переключатель красит тем же цветом цифры: можно выбрать шкалу, цифры, и то и другое или ничего.
          - Шкала стала толще, цифры чуть крупнее.
          - Обе шкалы в поповере окрашены так же.
          - Повторное нажатие сочетания клавиш закрывает окно с подробными лимитами.

          ### Виджеты

          - Виджеты снова становятся системным стеклом, когда рабочий стол закрыт окном, в бежевом и в тёмном оформлении. Сразу после обновления macOS может понадобиться до минуты.
          - Текст в виджетах больше не обрезается, отметка об устаревших данных видна в виджетах любого размера.

          ### Язык

          - Если выбран русский, в окне с подробными лимитами, в поповере и в уведомлениях о низком остатке больше нет английских слов.

          ### Обновления

          - Новая версия устанавливается, только если её контрольная сумма SHA-256 совпадает с опубликованной на GitHub.

          ## Установка

          Скачайте `CodexLimitWidget-1.3.0-macOS.dmg`, откройте его и перетащите `Codex Limit Widget.app` в `Applications`. Обновиться можно и из самого приложения.
          RELEASE_NOTES_RU
          elif [ "$GITHUB_REF_NAME" = "v1.2.401" ]; then
            cat > release-description.md <<'RELEASE_NOTES_EN'
          ## What's new in 1.2.401

          Codex Limit Widget 1.2.401 fixes the crash that closed the app when Codex opened from the menu bar or a widget. It also separates the notification controls of the two limit windows, makes the right-click action configurable, and delivers update notes reliably.

          ### Stability

          - Opening Codex from the menu bar or a widget no longer closes the app, and the menu bar percentage stays in place.

          ### Menu bar and widgets

          - Left-click and right-click actions are configured separately. The right-click action can be the context menu, the popover, Settings, or Codex.
          - The circular refresh arrow no longer appears next to the menu bar percentage; you can still refresh limits from the menu-bar menu, the popover, and Settings.
          - Widgets that still run an older build now follow the selected widget click action instead of always opening Settings.
          - The updater restarts the previous widget extension so a stale process does not keep serving the old click action.

          ### Notifications

          - The 5-hour and weekly limits have separate switches and separate thresholds, so each window alerts at the level you choose for it.
          - Quiet hours keep low-limit alerts silent during the hours you set and do not mute the restored-limit message.

          ### Updates

          - What's New opens reliably after an in-app update and includes the 1.2.400 notes when an update skipped them.

          ## Installation

          Download `CodexLimitWidget-1.2.401-macOS.dmg`, open it, and drag `Codex Limit Widget.app` to `Applications`. Existing users can install this version from inside the app.

          If you already run 1.2.401 (build 155), the in-app updater will not offer this republished build, because it compares version numbers and the number did not change. Download the DMG above and replace the app to move to build 156.
          RELEASE_NOTES_EN
            cat >> release-description.md <<'RELEASE_NOTES_RU'

          ---

          ## Что нового в 1.2.401

          Версия 1.2.401 исправляет падение при открытии Codex. Здесь же раздельные переключатели и пороги уведомлений для двух лимитов, отдельное действие по правому щелчку и заметки «Что нового» после обновления из приложения.

          ### Стабильность

          - Исправлено падение при открытии Codex из строки меню или по клику на виджет: процент остаётся в строке меню.

          ### Строка меню и виджеты

          - Действия по левому и правому щелчку настраиваются отдельно. Правый щелчок может открывать контекстное меню, поповер, настройки или Codex.
          - Круговая стрелка обновления больше не появляется рядом с процентом в строке меню; обновить лимиты по-прежнему можно из контекстного меню, поповера и настроек.
          - Виджеты со старой сборкой теперь следуют выбранному действию, а не всегда открывают настройки.
          - При обновлении старое расширение виджета перезапускается, чтобы оно не сохраняло прежнее действие по клику.

          ### Уведомления

          - У 5-часового и недельного лимитов свои переключатели и свои пороги: каждый лимит предупреждает на выбранном для него уровне.
          - В тихие часы предупреждения о низком остатке не приходят; сообщение о восстановлении лимита они не отключают.

          ### Обновления

          - Окно «Что нового» надёжно открывается после обновления из приложения и включает заметки 1.2.400, если прошлое обновление их пропустило.

          ## Установка

          Скачайте `CodexLimitWidget-1.2.401-macOS.dmg`, откройте его и перетащите `Codex Limit Widget.app` в `Applications`. Обновиться можно и из самого приложения.

          Если уже установлена 1.2.401 (сборка 155), обновления до этой сборки в приложении не будет: номер версии не менялся. Чтобы перейти на сборку 156, скачайте DMG и замените приложение вручную.
          RELEASE_NOTES_RU
          elif [ "$GITHUB_REF_NAME" = "v1.2.400" ]; then
            cat > release-description.md <<'RELEASE_NOTES_EN'
          ## What's new in 1.2.400

          Codex Limit Widget 1.2.400 adds eleven smaller improvements across the menu bar, widgets, notifications, and Settings, along with readable plan names and a weekly token chart.

          ### Menu bar

          - The left-click action on the menu-bar icon is configurable: popover, Settings, or Codex. Right-click opens its own menu with refresh, copy, and quit.
          - The menu-bar menu refreshes limits on demand and shows that data is loading while the request runs.
          - A configurable keyboard shortcut brings the detailed limits window to the front from any app.
          - The remaining percentage in the widget and popover is color-coded as normal, warning, or critical, so a low balance is visible at a glance.

          ### Widgets

          - Widgets and the popover show readable plan names such as Pro 5x, Pro 20x, and Plus instead of raw plan identifiers.
          - The large Beige widget plots token usage for the last seven days with date labels.
          - When the newest token data is from the current day, the large Beige widget labels it TODAY instead of LAST DAY.
          - Settings choose whether a click on a widget opens the app, the detailed limit window, or Codex.
          - The widget shows when limits were last synced successfully, and a toggle hides that line.

          ### Popover and notifications

          - A button in the popover copies the current status as text: plan, percentage, and reset time for each limit window.
          - Low-limit alerts stay quiet during the hours you choose, for example at night. Quiet hours do not mute the restored-limit message, which still needs system permission and the notification setting.
          - If the app observes an exhausted limit, it notifies you when the quota is available again, subject to system permission and the notification setting.

          ### Settings

          - Diagnostics show the data source, the last successful sync, and the CLI response when a refresh fails.
          - A confirmation-protected button deletes the stored limit snapshot, widget data, notification history, and app settings. Your Codex account and CLI sign-in stay untouched.

          ## Installation

          Download `CodexLimitWidget-1.2.400-macOS.dmg`, open it, and drag `Codex Limit Widget.app` to `Applications`. Existing users can install this version from inside the app.
          RELEASE_NOTES_EN
            cat >> release-description.md <<'RELEASE_NOTES_RU'

          ---

          ## Что нового в 1.2.400

          Версия 1.2.400 добавляет одиннадцать небольших улучшений: настройку строки меню, виджетов, уведомлений и раздела диагностики, а также понятные названия тарифов и график расхода токенов за неделю.

          ### Строка меню

          - Действие по левому клику настраивается: поповер, настройки или Codex. Правый клик открывает отдельное меню с обновлением, копированием и выходом.
          - Меню в строке меню обновляет лимиты по запросу и показывает, что данные загружаются.
          - Настраиваемое сочетание клавиш выводит подробное окно лимитов вперёд из любого приложения.
          - Процент остатка в виджете и поповере окрашивается по уровню: обычный, предупреждающий и критический. Низкий остаток видно сразу.

          ### Виджеты

          - Виджеты и поповер показывают понятные названия тарифов: Pro 5x, Pro 20x, Plus и другие вместо служебных идентификаторов.
          - Большой бежевый виджет строит график расхода токенов за последние семь дней с подписями дат.
          - Если свежие данные относятся к сегодняшнему дню, большой бежевый виджет подписывает строку TODAY, а не LAST DAY.
          - В настройках выбирается, что открывает нажатие на виджет: приложение, окно лимитов или Codex.
          - Виджет показывает время последней успешной синхронизации, строку можно скрыть тумблером.

          ### Поповер и уведомления

          - Кнопка в поповере копирует текущий статус текстом: тариф, процент и время сброса по каждому окну лимита.
          - Уведомления о низком остатке не приходят в заданные часы, например ночью. Тихие часы не отключают сообщение о восстановлении лимита, но для него нужны разрешение системы и включённая настройка уведомлений.
          - Если приложение успело заметить, что лимит исчерпан, оно сообщает, когда квота снова доступна. Для сообщения нужны разрешение системы и включённая настройка уведомлений.

          ### Настройки

          - Диагностика показывает источник данных, время последней успешной синхронизации и ответ CLI, если обновление не удалось.
          - Кнопка сброса локальных данных с подтверждением удаляет снимок лимитов, данные виджетов, историю уведомлений и настройки приложения. Аккаунт Codex и вход в CLI не затрагиваются.

          ## Установка

          Скачайте `CodexLimitWidget-1.2.400-macOS.dmg`, откройте его и перетащите `Codex Limit Widget.app` в `Applications`. Обновиться можно и из самого приложения.
          RELEASE_NOTES_RU
          elif [ "$GITHUB_REF_NAME" = "v1.2.0" ]; then
